spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties], optional:file:../../.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  jwt:
    secret: test-jwt-secret-64-characters-long-for-hs512-signature-tests-key-1234567890
    refresh-expiration: 86400000
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: profile, email
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/google
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

# 접두사는 `jobrunr` 다 — `org.jobrunr` 은 8.x 스타터가 무시한다.
# 무시되면 스타터 기본값(false)이 적용되어 결과적으로 꺼지긴 하지만,
# 그건 우연이지 의도가 아니다. 기본값이 바뀌면 테스트에서 배경 작업 서버가 켜진다.
jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false

storage:
  type: oci

oci:
  s3:
    access-key: test
    secret-key: test
    endpoint: http://localhost:9000
    bucket: test-bucket

ai:
  service-url: http://localhost:8001

app:
  realtime:
    transport: local
    outbox:
      enabled: false
  home:
    bootstrap:
      warmup:
        enabled: false
  prediction:
    warmup:
      enabled: false
  ai:
    coach-auto-brief:
      monitoring:
        enabled: false

baseball:
  datasource:
    driver-class-name: ${spring.datasource.driver-class-name}
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}

kbo:
  schema-guard:
    strict: false
