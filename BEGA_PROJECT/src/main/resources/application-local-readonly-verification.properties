# Dedicated verification boundary. Supply READONLY_* explicitly; there are no credential fallbacks.
# Also disable imports at launch (spring.config.import=) to avoid loading the default .env imports.
spring.config.import=
spring.autoconfigure.exclude=io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration,org.jobrunr.spring.autoconfigure.JobRunrAutoConfiguration,org.jobrunr.spring.autoconfigure.storage.JobRunrInMemoryStorageAutoConfiguration,org.jobrunr.spring.autoconfigure.storage.JobRunrMongoDBStorageAutoConfiguration,org.jobrunr.spring.autoconfigure.storage.JobRunrDocumentDBStorageAutoConfiguration,org.jobrunr.spring.autoconfigure.storage.JobRunrSqlStorageAutoConfiguration,org.jobrunr.spring.autoconfigure.metrics.JobRunrMetricsAutoConfiguration
server.address=127.0.0.1

spring.datasource.url=${READONLY_PRIMARY_DB_URL}
spring.datasource.username=${READONLY_PRIMARY_DB_USERNAME}
spring.datasource.password=${READONLY_PRIMARY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.read-only=true
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.data-source-properties.currentSchema=public
spring.datasource.data-source-properties.targetServerType=any
spring.datasource.data-source-properties.options=-c default_transaction_read_only=on
baseball.datasource.url=${READONLY_BASEBALL_DB_URL}
baseball.datasource.username=${READONLY_BASEBALL_DB_USERNAME}
baseball.datasource.password=${READONLY_BASEBALL_DB_PASSWORD}
baseball.datasource.driver-class-name=org.postgresql.Driver
baseball.datasource.hikari.read-only=true
baseball.datasource.hikari.minimum-idle=0
baseball.datasource.hikari.maximum-pool-size=2
baseball.datasource.data-source-properties.currentSchema=public
baseball.datasource.data-source-properties.targetServerType=any
baseball.datasource.data-source-properties.options=-c default_transaction_read_only=on
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties[hibernate.hbm2ddl.auto]=validate
spring.jpa.generate-ddl=false
baseball.jpa.hibernate.ddl-auto=validate
baseball.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
kbo.schema-guard.strict=true
spring.flyway.enabled=false
baseball.flyway.enabled=false
rag.flyway.enabled=false
app.flyway.auto-repair=false
spring.sql.init.mode=never
app.dev-data.enabled=false
app.dev-data.repair-existing=false
app.dev-db.hot-path-prewarm.enabled=false

jobrunr.job-scheduler.enabled=false
jobrunr.background-job-server.enabled=false
jobrunr.dashboard.enabled=false
jobrunr.database.skip-create=true
app.realtime.transport=local
app.realtime.outbox.enabled=false
app.ai-ingest.enabled=false
app.mail.enabled=false
spring.mail.test-connection=false
management.health.mail.enabled=false
app.client-error-monitoring.alerts.enabled=false
app.home.bootstrap.warmup.enabled=false
app.home.bootstrap.warmup.ranking.enabled=false
app.prediction.warmup.enabled=false
app.prediction.warmup.detail.enabled=false
app.prediction.warmup.vote-status.enabled=false
app.prediction.ranking-settlement-scheduler.enabled=false
app.leaderboard.game-result-scheduler.enabled=false
app.cheer.post-sync.scheduler.enabled=false
app.ai.coach-auto-brief.monitoring.enabled=false
media.cleanup.enabled=false
payment.payout.enabled=false

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.mail.host=127.0.0.1
spring.mail.port=9
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
ai.service-url=http://127.0.0.1:9
ai.internal-token=${READONLY_AI_INTERNAL_TOKEN}
app.frontend.url=http://127.0.0.1:5176
app.backend.url=http://127.0.0.1:8080
app.allowed-origins=http://127.0.0.1:5176
app.allow-preview-origins=false
spring.jwt.secret=${READONLY_JWT_SECRET}
app.oauth2.cookie-secret=${READONLY_OAUTH2_COOKIE_SECRET}
app.auth.refresh-token-pepper=${READONLY_REFRESH_TOKEN_PEPPER}
oci.s3.endpoint=http://127.0.0.1:9
oci.s3.access-key=${READONLY_S3_ACCESS_KEY}
oci.s3.secret-key=${READONLY_S3_SECRET_KEY}
oci.s3.bucket=${READONLY_S3_BUCKET}
toss.payment.secret-key=
toss.payment.confirm-url=http://127.0.0.1:9/confirm
toss.payment.cancel-url=http://127.0.0.1:9/cancel
toss.payout.api-secret=
toss.payout.base-url=http://127.0.0.1:9
toss.payout.encryption-public-key=
toss.payout.encryption-public-key-path=

spring.security.oauth2.client.registration.google.client-id=${READONLY_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${READONLY_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.kakao.client-id=${READONLY_KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${READONLY_KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.naver.client-id=${READONLY_NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${READONLY_NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=http://127.0.0.1:8080/login/oauth2/code/naver
spring.security.oauth2.client.provider.google.authorization-uri=http://127.0.0.1:9/oauth/google/authorize
spring.security.oauth2.client.provider.google.token-uri=http://127.0.0.1:9/oauth/google/token
spring.security.oauth2.client.provider.google.user-info-uri=http://127.0.0.1:9/oauth/google/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=http://127.0.0.1:9/oauth/google/jwks
spring.security.oauth2.client.provider.kakao.authorization-uri=http://127.0.0.1:9/oauth/kakao/authorize
spring.security.oauth2.client.provider.kakao.token-uri=http://127.0.0.1:9/oauth/kakao/token
spring.security.oauth2.client.provider.kakao.user-info-uri=http://127.0.0.1:9/oauth/kakao/userinfo
spring.security.oauth2.client.provider.naver.authorization-uri=http://127.0.0.1:9/oauth/naver/authorize
spring.security.oauth2.client.provider.naver.token-uri=http://127.0.0.1:9/oauth/naver/token
spring.security.oauth2.client.provider.naver.user-info-uri=http://127.0.0.1:9/oauth/naver/userinfo
